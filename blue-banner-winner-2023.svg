<svg width="160" height="168" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 168" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bannerWinner2023" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a8a"/>
      <stop offset="100%" stop-color="#0a2150"/>
    </linearGradient>
    <linearGradient id="rodWinner2023" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9b866"/>
      <stop offset="100%" stop-color="#9c7a34"/>
    </linearGradient>
  </defs>

  <!-- dowel -->
  <rect x="6" y="4" width="148" height="9" rx="4.5" fill="url(#rodWinner2023)"/>
  <circle cx="6" cy="8.5" r="6" fill="#c9a94f"/>
  <circle cx="154" cy="8.5" r="6" fill="#c9a94f"/>

