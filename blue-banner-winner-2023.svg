  <!-- text -->
  <text x="80" y="68" text-anchor="middle" fill="#f4b400" font-size="14" font-weight="700" letter-spacing="1">REGIONAL</text>
  <text x="80" y="93" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="800" letter-spacing="0.5">WINNER</text>
  <line x1="52" y1="100" x2="108" y2="100" stroke="#3f7fc9" stroke-width="1"/>
  <text x="80" y="114" text-anchor="middle" fill="#a9c0e6" font-size="13" font-weight="700" letter-spacing="1.5">2023</text>
